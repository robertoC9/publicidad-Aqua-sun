  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
  <audio id="backgroundMusic" autoplay loop preload="auto">

  <div id="video-wrapper" aria-hidden="true">

        <h1 class="content-title" id="content-title">Edición Limitada</h1>

          Descubre el sabor del verano con <span class="brand-green">AQUA SUN</span>.

        </p>
        <div class="flavor-list">
          <article class="flavor-card">
            <h2>Tropical</h2>
            <p>Mango &amp; Maracuyá</p>

          <article class="flavor-card">
